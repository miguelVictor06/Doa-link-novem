services:
  - type: web
    name: doalink-backend-7q4s
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: PGSSL
        value: require
      - key: PGSSL_REJECT_UNAUTHORIZED
        value: "true"
      - key: CORS_ORIGINS
        value: https://doa-link-novem.onrender.com
      - key: PUBLIC_API_URL
        value: https://doalink-backend-7q4s.onrender.com
      - key: SESSION_COOKIE_NAME
        value: doalink_sessao
      - key: SESSION_TTL_HOURS
        value: "168"
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: AUTH_RATE_LIMIT
        value: "20"
      - key: API_RATE_LIMIT
        value: "600"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: doalink

  - type: web
    name: doa-link-novem
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/doalink/browser
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: API_URL
        value: https://doalink-backend-7q4s.onrender.com/api
    headers:
      - path: /config.js
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
